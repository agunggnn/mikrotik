mqtt:
  enabled: false

auth:
  enabled: false

# go2rtc restreamer provides sub-second WebRTC viewing and single-connection camera proxy
go2rtc:
  streams:
    ezviz_h3c:
      - rtsp://admin:{FRIGATE_CCTV_VERIFICATION_CODE}@192.168.1.25:554/h264/ch1/main
    ezviz_h3c_sub:
      - rtsp://admin:{FRIGATE_CCTV_VERIFICATION_CODE}@192.168.1.25:554/h264/ch1/sub

cameras:
  ezviz_h3c:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/ezviz_h3c
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/ezviz_h3c_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 768
      height: 432
      fps: 10
    record:
      enabled: true
      continuous:
        days: 7
    snapshots:
      enabled: true
      retain:
        default: 14
version: 0.18-0
