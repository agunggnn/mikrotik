<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotspot WiFi - Logout</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Koneksi Diputuskan</h1>
    <p>Anda telah berhasil logout dari jaringan hotspot.</p>
    <a href="$(link-login)" class="btn">Login Kembali</a>
  </div>
</body>
</html>
